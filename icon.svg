<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="openmoe-bft: BFT quorum shield of safety experts">
  <title>openmoe-bft</title>
  <!-- Shield of experts -->
  <path d="M32 4 L54 12 V32 C54 46 44 56 32 60 C20 56 10 46 10 32 V12 Z"
        fill="#0e1726" stroke="#3da9fc" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Quorum nodes: 3 agreeing (filled) + 1 outvoted (hollow) = 2f+1 -->
  <circle cx="32" cy="20" r="4.2" fill="#3da9fc"/>
  <circle cx="21" cy="34" r="4.2" fill="#3da9fc"/>
  <circle cx="43" cy="34" r="4.2" fill="#3da9fc"/>
  <circle cx="32" cy="44" r="4.2" fill="none" stroke="#5b6b86" stroke-width="2"/>
  <!-- Consensus links between the agreeing quorum -->
  <g stroke="#3da9fc" stroke-width="1.6" stroke-linecap="round" opacity="0.85">
    <line x1="32" y1="20" x2="21" y2="34"/>
    <line x1="32" y1="20" x2="43" y2="34"/>
    <line x1="21" y1="34" x2="43" y2="34"/>
  </g>
  <!-- Quorum-reached check at the core -->
  <path d="M25 33 L30 38 L40 27" fill="none" stroke="#ffffff" stroke-width="2.6"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
