name: validate-agent-card
# Dogfood: openmoe-bft validates openmoe.ai's own A2A agent card on every change.
on:
  push:
    paths:
      - "web/.well-known/agent.json"
      - "openmoe_bft/**"
      - ".github/workflows/validate-agent-card.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install openmoe-bft from source
        run: pip install .
      - name: Validate agent card (structure must pass; compliance verdict reported)
        run: |
          python - << 'PY'
          import json, sys
          card = json.load(open("web/.well-known/agent.json"))
          from openmoe_bft.a2a import validate_card
          verdict = validate_card(card)
          print("compliant:", verdict.compliant)
          print("experts covered:", verdict.experts_covered)
          print("advisories:", len(verdict.advisory))
          for a in verdict.advisory[:10]:
              print(" -", a)
          # Hard gate = valid JSON + validator runs clean.
          # Full compliance verdict becomes blocking once signed SIGIL
          # evidence (metadata.*) ships with the hosted gateway.
          print("agent card OK — structure valid, validator executed")
          PY
