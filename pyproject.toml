[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openmoe-bft"
version = "0.1.0"
description = "Byzantine-fault-tolerant consensus for Mixture-of-Experts routing — every expert is a safety expert."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "MEOK AI Labs", email = "nicholas@meok.ai" }]
keywords = [
    "moe",
    "mixture-of-experts",
    "byzantine-fault-tolerance",
    "bft",
    "consensus",
    "ai-safety",
    "ai-governance",
    "eu-ai-act",
    "compliance",
    "openmoe",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
]

# The core library is stdlib-only by design, but the shipped MCP server
# (server.py) needs the MCP SDK to expose the compliance tools over
# streamable-http. Core modules still import fine without `mcp` installed.
dependencies = [
    "mcp>=1.0.0",
]

[project.scripts]
openmoe-bft = "openmoe_bft.cli:main"

[project.optional-dependencies]
# MCP transport for the MCP -> Expert registration protocol (network/server side).
mcp = ["mcp>=1.0.0"]
# x402 per-consensus / per-expert-call paywall (Empire Layer 10).
x402 = ["x402>=0.1.0"]
# Ed25519 cryptographic receipts (Empire Layer 9); HMAC-SHA256 is the
# stdlib default, this upgrades signing to Ed25519.
ed25519 = ["pynacl>=1.5.0"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://openmoe.ai"
Repository = "https://github.com/CSOAI-ORG/OPENMOE"
Specification = "https://openscore.ai"

[tool.hatch.build.targets.wheel]
# Ship the library package plus the root-level MCP server entrypoint, and
# nothing else (no tests, dist, dotfiles) — keeps the wheel lean.
only-include = ["openmoe_bft", "server.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
