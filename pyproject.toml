[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openmoe-bft"
version = "0.1.0"
description = "Byzantine-fault-tolerant consensus for Mixture-of-Experts routing — every expert is a safety expert."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "MEOK AI Labs", email = "nicholas@meok.ai" }]
keywords = [
    "moe",
    "mixture-of-experts",
    "byzantine-fault-tolerance",
    "bft",
    "consensus",
    "ai-safety",
    "ai-governance",
    "eu-ai-act",
    "compliance",
    "openmoe",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
]

# Core is stdlib-only by design: zero hard runtime dependencies so the
# squat-to-real PyPI upgrade stays trivial.
dependencies = []

[project.optional-dependencies]
# MCP transport for the MCP -> Expert registration protocol (network/server side).
mcp = ["mcp>=1.0.0"]
# x402 per-consensus / per-expert-call paywall (Empire Layer 10).
x402 = ["x402>=0.1.0"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://openmoe.ai"
Repository = "https://github.com/meokai/openmoe-bft"
Specification = "https://openscore.ai"

[tool.setuptools.packages.find]
include = ["openmoe_bft*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
